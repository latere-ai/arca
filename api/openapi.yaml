components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A token from an issuer this installation lists, carrying the audience it verifies.
  schemas:
    Error:
      type: object
      description: The one error shape of this API. A caller branches on error.code and shows error.message.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: The stable identifier of the row of the error table.
            details:
              type: object
              description: "What varies: always request_id, the developer sentence in detail, and the field paths at fault in fields."
              properties:
                detail:
                  type: string
                fields:
                  type: array
                  items:
                    type: string
                request_id:
                  type: string
            message:
              type: string
              description: The one sentence of that row, fixed and shown to a person.
          required:
          - code
          - message
      required:
      - error
    Page:
      type: object
      description: The one shape every list route answers. next_cursor is present only when a further page exists.
      properties:
        entries:
          type: array
          items:
            type: object
        next_cursor:
          type: string
      required:
      - entries
      additionalProperties: false
  responses:
    attachment_gone:
      description: "410 attachment_gone: This attachment has ended; attach again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    authorizer_unavailable:
      description: "503 authorizer_unavailable: The permission service is unavailable; retry shortly."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    bad_request:
      description: "400 bad_request: The request could not be read."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    body_too_large:
      description: "413 body_too_large: The request body is larger than this server accepts."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    exclusive_fields:
      description: "400 exclusive_fields: Two fields that cannot be set together are set."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    forbidden:
      description: "403 forbidden: You do not have permission to do this."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    internal:
      description: "500 internal: Something went wrong on this server."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_field:
      description: "400 invalid_field: A field has a value it cannot take."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_path:
      description: "400 invalid_path: That is not a path this server accepts."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    lease_not_held:
      description: "409 lease_not_held: This attachment does not hold the writer lease."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    length_required:
      description: "411 length_required: Send a Content-Length with the body."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    link_read_only:
      description: "422 link_read_only: A link grants reading and nothing more."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    manifest_incomplete:
      description: "409 manifest_incomplete: The manifest names objects that have not been uploaded."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    missing_field:
      description: "400 missing_field: A required field is missing."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    not_acceptable:
      description: "406 not_acceptable: This endpoint answers in JSON."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    not_found:
      description: "404 not_found: There is no such object."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    not_implemented:
      description: "501 not_implemented: This server does not serve that."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    object_too_large:
      description: "413 object_too_large: The object is larger than this server accepts."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    path_taken:
      description: "409 path_taken: Something already exists at that path."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    precondition_failed:
      description: "412 precondition_failed: The object is not in the state the request required."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    quota_exceeded:
      description: "413 quota_exceeded: This space has no room left."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    rate_limited:
      description: "429 rate_limited: Too many requests; wait and retry."
