              schema:
                $ref: "#/components/schemas/Error"
  /v1/files/materialize:
    get:
      operationId: getV1FilesMaterialize
      summary: Get space manifest
      description: One space as a manifest of presigned URLs. Asks the authorizer for file.list before it acts.
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/not_found"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          description: "authorizer_unavailable: The permission service is unavailable; retry shortly."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/files/{owner}/{path}:
    delete:
      operationId: deleteV1FilesByOwnerByPath
      summary: Delete file
      description: Trash the object; ?permanent=1 removes it and ?version=N prunes one version. Asks the authorizer for file.delete before it acts.
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        description: The rest of the path, slashes included.
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "204":
          description: No Content
          content:
            application/json:
              schema: {}
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/not_found"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          description: "authorizer_unavailable: The permission service is unavailable; retry shortly."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: getV1FilesByOwnerByPath
      summary: Read or list files
      description: Read one object, its subtree with ?list=1, which carries the space's usage at a plane root, or its versions with ?versions=1. Asks the authorizer for file.read before it acts.
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        description: The rest of the path, slashes included.
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/not_found"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          description: "authorizer_unavailable: The permission service is unavailable; retry shortly."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      operationId: headV1FilesByOwnerByPath
      summary: Get file headers
      description: The object's headers with no body. Asks the authorizer for file.read before it acts.
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        description: The rest of the path, slashes included.
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/not_found"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          description: "authorizer_unavailable: The permission service is unavailable; retry shortly."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: postV1FilesByOwnerByPath
      summary: Move or restore file
      description: Move the object with move_to, or bring a version forward with restore_version. Asks the authorizer for file.write before it acts.
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        description: The rest of the path, slashes included.
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/not_found"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          description: "authorizer_unavailable: The permission service is unavailable; retry shortly."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putV1FilesByOwnerByPath
      summary: Write file
      description: Write one object; the body is the bytes. Asks the authorizer for file.write before it acts.
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        description: The rest of the path, slashes included.
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {}
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/not_found"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          description: "authorizer_unavailable: The permission service is unavailable; retry shortly."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/shares:
    get:
      operationId: getV1Shares
