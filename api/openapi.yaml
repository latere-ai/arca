openapi: 3.1.0
info:
  title: Arca
  version: "1"
  description: "Durable storage for people, agents, and sandboxes: files with versions, trash and stars, uploads in parts, shares with a permission ladder and public links, workspaces with a writer lease, and an event log."
paths:
  /v1/admin/overview:
    get:
      operationId: getV1AdminOverview
      summary: List space usage
      description: One row per space with its usage and its counts. Asks the authorizer for space.admin before it acts.
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/not_found"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          description: "authorizer_unavailable: The permission service is unavailable; retry shortly."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/admin/spaces/{owner}/restore:
    post:
      operationId: postV1AdminSpacesByOwnerRestore
      summary: Restore deleted item
      description: Restore one deleted object or workspace of a space. Asks the authorizer for space.admin before it acts.
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/not_found"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          description: "authorizer_unavailable: The permission service is unavailable; retry shortly."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/events:
    get:
      operationId: getV1Events
      summary: List events
      description: One page of a space's log, oldest first. Asks the authorizer for event.read before it acts.
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
