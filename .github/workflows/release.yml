# A vX.Y.Z tag is a release. This workflow produces the artifacts spec 016
# names. The build, the signatures and the publish run through the shared
# image release stages of latere-ai/ci, and the two jobs that are Arca's
# own, the conformance run and the deploy, run between them against the
# digests the build outputs:
#
#   build        the shared build stage: the tag's commit is on main and
#                passed verify.yml, and CHANGELOG.md has a section for the
#                tag; then the four binary archives, and the arcad and
#                arca-stubs images for linux/amd64 and linux/arm64, each
#                pushed by digest under no tag, arcad asked for its
#                version, both signed, each given an SPDX document and the
#                SBOM and provenance attestations
#   conformance  the kind stack of spec 016 brought up from those digests,
#                with the suite of spec 017 run against it
#   deploy       only with the repository variable ARCA_RELEASE_DEPLOY:
#                deploy/prod applied with arcad pinned by digest, the
#                rollout waited for, the smoke
#   publish      the shared publish stage: each digest gets the tag, then
#                checksums.txt over every attached file, signed, and the
#                GitHub release, its body the CHANGELOG section for the tag
#                with the conformance and smoke evidence appended
#   verify       the shared verify stage: the published release checked
#                from a runner with no checkout, with the commands
#                docs/operations.md gives an operator
#
# Of the three jobs spec 016 designs and its Outcome lists as not written,
# `release-verify` is the verify stage above. The other two are not here
# yet: `candidate`, which starts the published image beside a fresh
# Postgres and MinIO before anything reaches a cluster, and
# `install-release`, which walks docs/install.md against the published
# artifacts alone. They join when the stores they need exist.
#
# The images publish under ghcr.io/<repository owner>, lowered, or under
# ghcr.io/<RELEASE_IMAGE_NAMESPACE> where that repository variable is set,
# so a tag on a fork publishes to the fork's own packages and none of
# Latere's. Every third-party action is pinned by commit, with the version
# beside it.
name: Release

on:
  push:
    tags: ['v*']

# Read by default; each job that writes says so.
permissions:
  contents: read

jobs:
  # Step 1. Everything built from the tag's tree, pushed by digest, signed
  # and attested. Nothing here reaches a cluster, and no image gets the tag
  # before publish.
  build:
    uses: latere-ai/ci/.github/workflows/image-build.yml@c3fcc1bda62305ca978a5474dd29a898564baa42
    # The stage reads the verify runs of the tagged commit, pushes the
    # images, signs them with the job's OIDC token and attests them; a
    # calling job that grants less fails before it starts.
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      # arcad answers -version with "arcad <tag> (<commit>, <date>)".
      # Dockerfile.ci compiles nothing: it copies the binary the archives
      # below built for its platform. Dockerfile.stubs is spec 014's: it
      # builds the stub issuer and the stub authorizer into one image, so an
      # operator's first installation and the kind example run a released,
      # signed stub and not a checkout. Its command prints no version.
      image_1: '{"name": "arcad", "dockerfile": "Dockerfile.ci", "version_args": "-version", "version_expect": "{name} {tag} ("}'
      image_2: '{"name": "arca-stubs", "dockerfile": "Dockerfile.stubs"}'
      # Four archives. The -ldflags are the Makefile's, so a binary from the
      # pipeline and one from `make build` report their identity the same
      # way. The binaries stay under out/release/bin/<os>_<arch>/, which
      # Dockerfile.ci copies its platform's from. The archives are written
      # under the ignored out/ and moved into dist/, whose files the release
      # attaches, only once every build is done, so no build sees an
      # untracked file and stamps its binary as built from a modified tree.
      archives_command: |
        commit=$(git rev-parse --short HEAD)
        date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        pkg=latere.ai/x/arca/internal/version
        for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
          os=${platform%_*}
          arch=${platform#*_}
          mkdir -p "out/release/bin/${platform}"
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
            -ldflags "-X ${pkg}.Version=${TAG} -X ${pkg}.Commit=${commit} -X ${pkg}.Date=${date}" \
            -o "out/release/bin/${platform}/arcad" ./cmd/arcad
          tar -C "out/release/bin/${platform}" -czf \
            "out/release/arcad_${TAG}_${os}_${arch}.tar.gz" arcad
        done
        mv out/release/*.tar.gz dist/
      runs_on: ubuntu-latest

  # Step 2. The kind stack of spec 016, brought up from the digests that were
  # just pushed rather than from a second build of them, and the suite of
  # spec 017 run against it. A failure here stops the release.
  conformance:
    name: conformance against the published image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The images carry no tag until publish, so the stack pulls them by
    # digest, and a fork's packages are private until their owner opens
    # them, so the pull signs in with the job's token.
    permissions:
      contents: read
      packages: read
    env:
      ARCA_TEST_URL: http://localhost:30180
      ARCA_TEST_ISSUER_URL: http://localhost:30081
      ARCA_TEST_AUTHORIZER_URL: http://localhost:30082
      # The administrator the administration group of spec 012 drives. The
      # stack's authorizer is the stub of spec 014, which answers space.admin
      # for every subject, so naming one here is what admits the group: the
      # suite mints that subject at the stub issuer and drives the two admin
      # routes as it. A run that named none skipped them.
      ARCA_TEST_ADMIN: admin
      ARCA_TEST_S3_ENDPOINT: http://localhost:30900
      ARCA_TEST_DATABASE_URL: postgres://arca:arca@localhost:30432/arca?sslmode=disable
    steps:
      # The whole history, for its tags: the run of the previous release's
      # suite below reads the previous tag off them (spec 024).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true

      # Every overlay of the tree rendered by the kustomize kubectl embeds.
      # The gate's own test proves that every path a render reads exists;
      # this is the render itself, which is what catches a patch whose
      # target does not match and is silently dropped.
      - name: Render every overlay
        run: |
          set -euo pipefail
          for dir in deploy/base deploy/examples/kind deploy/examples/aws deploy/examples/digitalocean deploy/prod; do
            kubectl kustomize "$dir" > /dev/null
            echo "rendered $dir"
          done
          kubectl kustomize deploy/examples/kind | grep -q 'nodePort: 30180'
          kubectl kustomize deploy/prod | grep -q 'path: /version'

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # up.sh pulls each image by the reference it is given and loads it
      # into the cluster under the tag the overlay pins, so the stack runs
      # the published bytes, the linux/amd64 entry of each.
      - name: Bring the stack up
        env:
          ARCAD_IMAGE: ${{ needs.build.outputs.ref_1 }}@${{ needs.build.outputs.digest_1 }}
          STUBS_IMAGE: ${{ needs.build.outputs.ref_2 }}@${{ needs.build.outputs.digest_2 }}
        run: deploy/examples/kind/up.sh

      # The suite is spec 017's, in test/conformance, and this is its run:
      # the cases of that spec against the published image on a real
      # cluster, with the stub issuer minting every subject and the stub
      # authorizer's control API reachable, so the deny, the outage and the
      # byte limit cases run rather than skip.
      #
      # The smoke of spec 016 runs first and stays. It proves the probes
      # answer, so a suite failure is read as the image answering a request
      # wrong rather than as a stack that never came up, and its evidence is
      # appended to the conformance section the release body carries.
      #
      # The job fails on any failed case, which includes the suite's pending
      # group while the build does not answer every route of spec 013. That
      # is the gate spec 016's table asks for: a release does not publish an
      # installation that serves part of the contract.
      - name: Run the conformance suite against the stack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          BASE_URL="$ARCA_TEST_URL" OUTPUT_MD=release-evidence/smoke-on-kind.md \
            tools/smoke/release.sh
          go test -v -count=1 -timeout 30m -tags=tiers ./test/conformance/... \
            -run '^(TestContract|TestTheSuiteReachesNoHelperOfThisTree)$' \
            -args -url "$ARCA_TEST_URL" -issuer "$ARCA_TEST_ISSUER_URL" \
            -authorizer "$ARCA_TEST_AUTHORIZER_URL" -admin "$ARCA_TEST_ADMIN" 2>&1 | tee conformance.log
          {
            echo "## Conformance"
            echo
            echo "The suite of spec 017 against the published image, on the kind"
            echo "stack of spec 016."
            echo
            echo '```'
            grep -E '^(    contract_test\.go|--- (PASS|FAIL|SKIP)|ok|FAIL)' conformance.log | tail -60
            echo '```'
          } > release-evidence/conformance.md
          cat release-evidence/smoke-on-kind.md >> release-evidence/conformance.md

      # Spec 024: the suite of the release before this one, with the driver
      # it shipped with, fetched as a module and run against the same stack.
      # The driver reads the target from the ARCA_TEST_* variables of the
      # job. A case it fails fails the job, unless supersededCases in
      # test/conformance/superseded_test.go lists it as a refusal this
      # release turned into an operation, which the run skips and the
      # evidence names under its reason. A release with no previous tag in
      # its major says why and passes.
      - name: Run the previous release's suite against the stack
        env:
          ARCA_RELEASE_TAG: ${{ github.ref_name }}
          # go test runs in the package's directory, so the path is the
          # workspace's own, where the step below reads it.
          ARCA_PREVIOUS_SUITE_MD: ${{ github.workspace }}/release-evidence/previous-suite.md
        run: |
          set -euo pipefail
          # The suite above and this one drive the same subjects, and the two
          # together send more requests than the per-subject bucket of spec
          # 015 holds in a minute (ARCA_REQUESTS_PER_MINUTE, 600 on the
          # stack). The bucket refills within a minute, so this suite starts
          # with a full one rather than failing on rate_limited answers that
          # say nothing about the release.
          sleep 60
          go test -v -count=1 -timeout 30m -tags=tiers ./test/conformance/ \
            -run '^TestPreviousSuitePasses$' 2>&1 | tee previous-suite.log
          { echo; cat release-evidence/previous-suite.md; } >> release-evidence/conformance.md

      # The server's view, only when a step above failed: the client sees a
      # reset, and what reset it is in the pods' logs.
      - name: Dump the stack on failure
        if: failure()
        run: |
          set +e
          echo "===== pods ====="
          kubectl get pods -n arca -o wide
          echo "===== events ====="
          kubectl get events -n arca --sort-by=.lastTimestamp | tail -80
          for p in $(kubectl get pods -n arca -o name); do
            echo "===== $p (current) ====="
            kubectl logs "$p" -n arca --all-containers --prefix --tail=-1
            echo "===== $p (previous, if it restarted) ====="
            kubectl logs "$p" -n arca --all-containers --prefix --previous --tail=-1 2>/dev/null || echo "(no previous container)"
          done
          echo "===== describe arcad ====="
          kubectl describe pods -n arca -l app.kubernetes.io/name=arcad
          # The one line that names the failing check. A 503 from the
          # readiness probe reaches the events as a status code and nothing
          # else; the body is where arcad says which requirement it is
          # waiting on, and v0.1.2's run was lost for want of it.
          # kubectl's --raw turns the 503 into its own ServiceUnavailable
          # error and drops the body, so the read goes through a
          # port-forward and curl, which prints a 503's body as it is.
          for p in $(kubectl get pods -n arca -l app.kubernetes.io/name=arcad,app.kubernetes.io/component!=migrate -o name); do
            echo "== ${p#pod/} /readyz"
            kubectl -n arca port-forward "$p" 18081:8081 >/dev/null 2>&1 &
            pf=$!
            sleep 2
            curl -sS -m 10 -w '\nHTTP %{http_code}\n' http://127.0.0.1:18081/readyz || echo "(readyz unreachable through a port-forward)"
            kill $pf 2>/dev/null || true
            echo
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-evidence
          path: release-evidence/conformance.md
          if-no-files-found: error

  # Step 3. Latere's own installation. The repository variable and the
  # kubeconfig secret are set on this repository and on no fork, so a tag on
  # a fork publishes every artifact and skips this step.
  #
  # The job runs under the production environment, so the rollout is a
  # GitHub deployment with a URL on the repository's Deployments page and
  # not a step buried in a log, and the environment's required reviewer is
  # what holds the run here until the maintainer approves it.
  deploy:
    name: deploy and smoke
    # build is named for its outputs: a job reads the outputs of the jobs it
    # needs directly, and of no other.
    needs: [build, conformance]
    if: ${{ vars.ARCA_RELEASE_DEPLOY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://api.latere.ai
    outputs:
      evidence: ${{ steps.smoke.outputs.evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.ARCA_KUBECONFIG }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      # deploy/prod holds only re-appliable manifests; deploy/bootstrap is
      # never read here, and the migration Job it holds is run by hand
      # before the tag, because a forward-only schema cannot be applied by
      # two processes at once.
      - name: Apply deploy/prod and roll the new image
        env:
          ARCAD_REF: ${{ needs.build.outputs.ref_1 }}
          ARCAD_DIGEST: ${{ needs.build.outputs.digest_1 }}
        run: |
          set -euo pipefail
          # The namespace is the overlay's, not a name repeated here: an
          # installation chooses where it runs, and this job deploys
          # whatever deploy/prod declares.
          NS=$(kubectl kustomize deploy/prod | awk '/^  namespace: /{print $2; exit}')
          test -n "$NS"
          # deploy/prod pins the image by its Latere name. A repository
          # publishing elsewhere applies the same manifests against its own
          # packages, so the name moves with the images before the apply
          # rather than only on the set image below.
          if [ "$ARCAD_REF" != "ghcr.io/latere-ai/arcad" ]; then
            sed -i "s|ghcr.io/latere-ai/arcad|${ARCAD_REF}|g" deploy/prod/kustomization.yaml deploy/base/deployment.yaml deploy/base/reaper.yaml
          fi
          # deploy/prod names the image's tag as committed, and the image
          # gets this release's tag only when publish runs, after this job.
          # The apply pins the digest the build pushed in place of the tag,
          # so neither arcad nor the reaper, which runs the same image, is
          # rolled to any other build on the way.
          sed -i "s|^\(  *\)newTag: .*|\1digest: ${ARCAD_DIGEST}|" deploy/prod/kustomization.yaml
          grep -q "digest: ${ARCAD_DIGEST}\$" deploy/prod/kustomization.yaml
          kubectl apply -k deploy/prod/
          kubectl -n "$NS" set image deployment/arcad "arcad=${ARCAD_REF}@${ARCAD_DIGEST}"
          kubectl -n "$NS" rollout status deployment/arcad --timeout=600s
          kubectl -n "$NS" rollout status deployment/arcad-reaper --timeout=600s

      # The smoke reads the origin GitHub records as the deployment, not a
      # forwarded port: the rollout returns as soon as the new replicas are
      # ready, and only a request through the ingress proves that what
      # answers there is the version just built.
      - name: Smoke the live service
        id: smoke
        env:
          BASE_URL: https://api.latere.ai
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          OUTPUT_MD=release-evidence/smoke.md tools/smoke/release.sh
          cat release-evidence/smoke.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'evidence<<CI_EOF'
            cat release-evidence/smoke.md
            echo CI_EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-evidence
          path: release-evidence/smoke.md
          if-no-files-found: error

  # Step 4. The GitHub release: each digest gets the tag, every file the
  # build wrote is attached with checksums.txt over them and its signature,
  # and the CHANGELOG.md section is the body, then the evidence of the jobs
  # that ran.
  publish:
    needs: [build, conformance, deploy]
    # deploy is skipped on every repository that sets no
    # ARCA_RELEASE_DEPLOY, and a job that leans on the implicit success() is
    # skipped whenever a job above it in the graph is, so each result is
    # named here.
    if: ${{ always() && needs.build.result == 'success' && needs.conformance.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' }}
    uses: latere-ai/ci/.github/workflows/image-publish.yml@c3fcc1bda62305ca978a5474dd29a898564baa42
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      images: ${{ needs.build.outputs.images }}
      title: Arca
      evidence: '*-evidence'
      runs_on: ubuntu-latest

  # Step 5. The published release read back from a runner with no checkout:
  # the signature over checksums.txt, every asset against it, each image's
  # tag to a signed and attested digest, and the body against the CHANGELOG
  # section.
  verify:
    needs: publish
    # deploy sits above this job in the graph and is skipped on a fork, so
    # the result this job waits on is named, as on publish.
    if: ${{ always() && needs.publish.result == 'success' }}
    uses: latere-ai/ci/.github/workflows/release-verify.yml@c3fcc1bda62305ca978a5474dd29a898564baa42
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      images: |
        arcad
        arca-stubs
      runs_on: ubuntu-latest
