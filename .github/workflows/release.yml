# A vX.Y.Z tag is a release. This workflow produces the artifacts spec 016
# names and calls no shared workflow: `service-release.yml` of latere-ai/ci
# builds one architecture and runs its deploy and its smoke as one job it
# does not expose as a callable step, and a core an outsider installs needs
# archives, checksums, signatures, a bill of materials and both
# architectures, none of which that workflow produces.
#
#   build        the four binary archives, checksums.txt, the two
#                multi-arch images, the cosign signatures, the three SPDX
#                documents, and the SBOM and provenance attestations
#   conformance  the kind stack of spec 016 brought up from the published
#                images, with the suite of spec 017 run against it
#   deploy       only with the repository variable ARCA_RELEASE_DEPLOY:
#                deploy/prod applied, the rollout waited for, the smoke
#   publish      the GitHub release, its body the CHANGELOG section for the
#                tag with the smoke and conformance evidence appended
#
# Spec 016 designs three more jobs that are not here yet, and its Outcome
# says so: `candidate`, which starts the published image beside a fresh
# Postgres and MinIO before anything reaches a cluster; `install-release`,
# which walks docs/install.md against the published artifacts alone; and
# `release-verify`, which checks the signatures, the attestations and the
# checksums from a clean runner. They join when the stores they need exist.
#
# Every third-party action is pinned by commit, with the version beside it.
name: Release

on:
  push:
    tags: ['v*']

# Read by default; each job that writes says so. Keyless signing needs
# id-token: write and the attestations need attestations: write.
permissions:
  contents: read

# The registry namespace both images are published under, derived from the
# repository that runs the workflow: a tag on a fork publishes to the fork's
# own packages and no name here is Latere's. The repository variable
# ARCA_RELEASE_IMAGE_NAMESPACE overrides it for an installation that
# publishes elsewhere, and an owner whose login carries capitals must set
# it, because an image reference is lowercase and a workflow expression
# cannot fold case.
env:
  IMAGE_NAMESPACE: ${{ vars.ARCA_RELEASE_IMAGE_NAMESPACE || format('ghcr.io/{0}', github.repository_owner) }}
  ARCAD_IMAGE: ${{ vars.ARCA_RELEASE_IMAGE_NAMESPACE || format('ghcr.io/{0}', github.repository_owner) }}/arcad
  STUBS_IMAGE: ${{ vars.ARCA_RELEASE_IMAGE_NAMESPACE || format('ghcr.io/{0}', github.repository_owner) }}/arca-stubs

jobs:
  # Step 1. Everything built from the tag's tree, signed, and attested.
  # Nothing here reaches a cluster.
  build:
    name: artifacts, images, signatures, attestations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      arcad_digest: ${{ steps.arcad.outputs.digest }}
      stubs_digest: ${{ steps.stubs.outputs.digest }}
    steps:
      # docker/metadata-action and the registry sanitise an image tag to
      # [a-zA-Z0-9._-], so a SemVer build-metadata tag would push as
      # v1.0.0-exp-sha.5114f85 while `kubectl set image` below still names
      # the raw ref with its '+'. The deploy needs image tag == git tag, so
      # the tag is refused here, before anything is pushed.
      - name: Reject build-metadata tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *+*) echo "::error::${TAG} carries SemVer build metadata; an image tag cannot contain '+'. Cut a tag without it."; exit 1 ;;
          esac

      # An image reference is lowercase and carries no scheme and no tag,
      # and the default namespace is the repository owner's login, which
      # preserves case. A fork whose owner has capitals is told here what to
      # set, rather than by a push that fails after the archives are built.
      - name: Check the image namespace
        run: |
          case "$IMAGE_NAMESPACE" in
            *[[:upper:]]*|*:*|*//*|*' '*|"")
              echo "::error::ARCA_RELEASE_IMAGE_NAMESPACE is '${IMAGE_NAMESPACE}', which is not a lowercase image reference prefix. Set the repository variable to one, for example ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')."
              exit 1 ;;
          esac
          echo "publishing under ${IMAGE_NAMESPACE}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Four archives and the checksums over them. The -ldflags are the
      # Makefile's, so a binary from the pipeline and one from `make build`
      # report their identity the same way. The binaries stay under
      # out/release/bin/<os>_<arch>/, which Dockerfile.ci copies its
      # platform's from.
      - name: Build the release archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse --short HEAD)
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          pkg=latere.ai/x/arca/internal/version
          mkdir -p out/release
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            os=${platform%_*}
            arch=${platform#*_}
            mkdir -p "out/release/bin/${platform}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-X ${pkg}.Version=${TAG} -X ${pkg}.Commit=${commit} -X ${pkg}.Date=${date}" \
              -o "out/release/bin/${platform}/arcad" ./cmd/arcad
            tar -C "out/release/bin/${platform}" -czf \
              "out/release/arcad_${TAG}_${os}_${arch}.tar.gz" arcad
          done
          cd out/release && sha256sum ./*.tar.gz > checksums.txt
          cat checksums.txt

      # The runtime stage is distroless and carries no package manager, so
      # nothing is installed per platform; the emulator is still needed for
      # buildx to assemble the arm64 entry of the manifest list.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Inline attestations carry the build time, so two builds of one
      # commit differ; they are attached below as referrers instead.
      - name: Build and push arcad
        id: arcad
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx build --push --provenance=false --sbom=false \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.ci \
            -t "${ARCAD_IMAGE}:${TAG}" \
            --metadata-file arcad.json .
          digest=$(jq -r '."containerimage.digest"' arcad.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Dockerfile.stubs is spec 014's: it builds the stub issuer and the
      # stub authorizer into one image, so an operator's first installation
      # and the kind example run a released, signed stub and not a
      # checkout. This job publishes it; that spec writes it.
      - name: Build and push arca-stubs
        id: stubs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx build --push --provenance=false --sbom=false \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.stubs \
            -t "${STUBS_IMAGE}:${TAG}" \
            --metadata-file stubs.json .
          digest=$(jq -r '."containerimage.digest"' stubs.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Assert both architectures are published
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for image in "${ARCAD_IMAGE}:${TAG}" "${STUBS_IMAGE}:${TAG}"; do
            docker buildx imagetools inspect "$image" --raw > manifest.json
            for arch in amd64 arm64; do
              grep -q "\"architecture\": *\"$arch\"" manifest.json \
                || { echo "::error::$image has no linux/$arch entry"; exit 1; }
            done
            echo "$image carries linux/amd64 and linux/arm64"
          done

      # Three SPDX documents: the module graph from the tree, and the
      # contents of each image.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: out/release/sbom-module.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.ARCAD_IMAGE }}@${{ steps.arcad.outputs.digest }}
          format: spdx-json
          output-file: out/release/sbom-arcad.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.STUBS_IMAGE }}@${{ steps.stubs.outputs.digest }}
          format: spdx-json
          output-file: out/release/sbom-arca-stubs.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # GitHub's attestation API refuses a private repository on this
      # organization's plan. Arca is public, so these run; the condition
      # stays because a repository made private would otherwise fail here
      # with the images already pushed, and a fork that is private is told
      # rather than stopped.
      - name: Attestations are skipped on a private repository
        if: ${{ github.event.repository.private }}
        run: |
          echo "::notice::the repository is private, so the SBOM and provenance attestations are not attached; GitHub's attestation API refuses a private repository on this plan. The SPDX documents ship as release assets and the images are signed with cosign."

      - uses: actions/attest-sbom@36590ecaf038d6630c74f2da259095627d52ac11 # v4.1.0
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.ARCAD_IMAGE }}
          subject-digest: ${{ steps.arcad.outputs.digest }}
          sbom-path: out/release/sbom-arcad.spdx.json
          push-to-registry: true
      - uses: actions/attest-sbom@36590ecaf038d6630c74f2da259095627d52ac11 # v4.1.0
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.STUBS_IMAGE }}
          subject-digest: ${{ steps.stubs.outputs.digest }}
          sbom-path: out/release/sbom-arca-stubs.spdx.json
          push-to-registry: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.ARCAD_IMAGE }}
          subject-digest: ${{ steps.arcad.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.STUBS_IMAGE }}
          subject-digest: ${{ steps.stubs.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the workflow's OIDC identity is the signer, which is what
      # an operator outside Latere can check without holding a key. A
      # sigstore bundle carries the signature, the certificate, and the
      # transparency-log proof in one file, so checksums.txt is verified
      # from the release assets alone.
      - name: Sign the images and checksums.txt
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          cosign sign "${ARCAD_IMAGE}@${{ steps.arcad.outputs.digest }}"
          cosign sign "${STUBS_IMAGE}@${{ steps.stubs.outputs.digest }}"
          cd out/release && cosign sign-blob --bundle checksums.txt.cosign.bundle checksums.txt

      # Every overlay of the tree rendered by the kustomize kubectl embeds.
      # The gate's own test proves that every path a render reads exists;
      # this is the render itself, which is what catches a patch whose
      # target does not match and is silently dropped.
      - name: Render every overlay
        run: |
          set -euo pipefail
          for dir in deploy/base deploy/examples/kind deploy/examples/aws deploy/examples/digitalocean deploy/prod; do
            kubectl kustomize "$dir" > /dev/null
            echo "rendered $dir"
          done
          kubectl kustomize deploy/examples/kind | grep -q 'nodePort: 30180'
          kubectl kustomize deploy/prod | grep -q 'path: /version'

      # The bytes are pulled back from the registry, so the stack of step 2
      # runs the published image and not a second build of it.
      - name: Save the published linux/amd64 images for the stack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p out/images
          docker pull "${ARCAD_IMAGE}@${{ steps.arcad.outputs.digest }}"
          docker pull "${STUBS_IMAGE}@${{ steps.stubs.outputs.digest }}"
          docker tag "${ARCAD_IMAGE}@${{ steps.arcad.outputs.digest }}" "ghcr.io/latere-ai/arcad:candidate"
          docker tag "${STUBS_IMAGE}@${{ steps.stubs.outputs.digest }}" "ghcr.io/latere-ai/arca-stubs:candidate"
          docker save -o out/images/arcad.tar "ghcr.io/latere-ai/arcad:candidate"
          docker save -o out/images/arca-stubs.tar "ghcr.io/latere-ai/arca-stubs:candidate"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-images
          path: out/images/*.tar
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            out/release/*.tar.gz
            out/release/checksums.txt
            out/release/checksums.txt.cosign.bundle
            out/release/*.spdx.json
          if-no-files-found: error

  # Step 2. The kind stack of spec 016, brought up from the images that were
  # just published rather than from a second build of them, and the suite of
  # spec 017 run against it. A failure here stops the release.
  conformance:
    name: conformance against the published image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ARCA_TEST_URL: http://localhost:30180
      ARCA_TEST_ISSUER_URL: http://localhost:30081
      ARCA_TEST_AUTHORIZER_URL: http://localhost:30082
      ARCA_TEST_S3_ENDPOINT: http://localhost:30900
      ARCA_TEST_DATABASE_URL: postgres://arca:arca@localhost:30432/arca?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-images
          path: out/images
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: Bring the stack up
        run: deploy/examples/kind/up.sh out/images/arcad.tar out/images/arca-stubs.tar

      # The suite is spec 017's and lives in test/conformance. Until that
      # spec lands there is nothing to run, so the release is held to the
      # probes of the published image on a real cluster, which is what this
      # job could prove before the suite existed. Spec 017 replaces the
      # `else` branch with its own run and owns that criterion.
      - name: Run the conformance suite against the stack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          if [ -d test/conformance ]; then
            go test -v -count=1 -timeout 30m -tags=e2e ./test/conformance/... 2>&1 | tee conformance.log
            {
              echo "## Conformance"
              echo
              echo '```'
              grep -E '^(--- (PASS|FAIL|SKIP)|ok|FAIL)' conformance.log | tail -60
              echo '```'
            } > release-evidence/conformance.md
          else
            BASE_URL="$ARCA_TEST_URL" OUTPUT_MD=release-evidence/conformance.md \
              tools/smoke/release.sh
            {
              echo
              echo "The conformance suite of spec 017 is not in the tree yet, so the"
              echo "published image was proved on the kind stack by the release smoke"
              echo "alone. Spec 017 owns the suite and this job's real run."
            } >> release-evidence/conformance.md
          fi

      # The server's view, only when a step above failed: the client sees a
      # reset, and what reset it is in the pods' logs.
      - name: Dump the stack on failure
        if: failure()
        run: |
          set +e
          echo "===== pods ====="
          kubectl get pods -n arca -o wide
          echo "===== events ====="
          kubectl get events -n arca --sort-by=.lastTimestamp | tail -80
          for p in $(kubectl get pods -n arca -o name); do
            echo "===== $p (current) ====="
            kubectl logs "$p" -n arca --all-containers --prefix --tail=-1
            echo "===== $p (previous, if it restarted) ====="
            kubectl logs "$p" -n arca --all-containers --prefix --previous --tail=-1 2>/dev/null || echo "(no previous container)"
          done
          echo "===== describe arcad ====="
          kubectl describe pods -n arca -l app.kubernetes.io/name=arcad

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-evidence
          path: release-evidence/conformance.md
          if-no-files-found: error

  # Step 3. Latere's own installation. The repository variable and the
  # kubeconfig secret are set on this repository and on no fork, so a tag on
  # a fork publishes every artifact and skips this step.
  #
  # The job runs under the production environment, so the rollout is a
  # GitHub deployment with a URL on the repository's Deployments page and
  # not a step buried in a log, and the environment's required reviewer is
  # what holds the run here until the maintainer approves it.
  deploy:
    name: deploy and smoke
    needs: conformance
    if: ${{ vars.ARCA_RELEASE_DEPLOY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://api.latere.ai
    outputs:
      evidence: ${{ steps.smoke.outputs.evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.ARCA_KUBECONFIG }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      # deploy/prod holds only re-appliable manifests; deploy/bootstrap is
      # never read here, and the migration Job it holds is run by hand
      # before the tag, because a forward-only schema cannot be applied by
      # two processes at once.
      - name: Apply deploy/prod and roll the new image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The namespace is the overlay's, not a name repeated here: an
          # installation chooses where it runs, and this job deploys
          # whatever deploy/prod declares.
          NS=$(kubectl kustomize deploy/prod | awk '/^  namespace: /{print $2; exit}')
          test -n "$NS"
          # deploy/prod pins the image by its Latere name. A repository
          # publishing elsewhere applies the same manifests against its own
          # packages, so the name moves with the images before the apply
          # rather than only on the set image below.
          if [ "$IMAGE_NAMESPACE" != "ghcr.io/latere-ai" ]; then
            sed -i "s|ghcr.io/latere-ai/arcad|${ARCAD_IMAGE}|g" deploy/prod/kustomization.yaml deploy/base/deployment.yaml deploy/base/reaper.yaml
          fi
          kubectl apply -k deploy/prod/
          kubectl -n "$NS" set image deployment/arcad "arcad=${ARCAD_IMAGE}:${TAG}"
          kubectl -n "$NS" rollout status deployment/arcad --timeout=600s

      # The smoke reads the origin GitHub records as the deployment, not a
      # forwarded port: the rollout returns as soon as the new replicas are
      # ready, and only a request through the ingress proves that what
      # answers there is the version just built.
      - name: Smoke the live service
        id: smoke
        env:
          BASE_URL: https://api.latere.ai
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          OUTPUT_MD=release-evidence/smoke.md tools/smoke/release.sh
          cat release-evidence/smoke.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'evidence<<CI_EOF'
            cat release-evidence/smoke.md
            echo CI_EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-evidence
          path: release-evidence/smoke.md
          if-no-files-found: error

  # Step 4. The GitHub release: every artifact, the CHANGELOG.md section as
  # the body, then the evidence of the steps that ran.
  publish:
    name: publish the release
    needs: [build, conformance, deploy]
    # deploy is skipped on every repository that sets no
    # ARCA_RELEASE_DEPLOY, and a job that leans on the implicit success() is
    # skipped whenever a job above it in the graph is, so each result is
    # named here.
    if: ${{ always() && needs.build.result == 'success' && needs.conformance.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: assets
          pattern: 'release-*'
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: evidence
          pattern: '*-evidence'
          merge-multiple: true
      # A tag is a release, and a release has notes. The section for the tag
      # in CHANGELOG.md is the body; no section fails here, before anything
      # is created. The pre-push hook refuses the tag with the same reader,
      # so this branch is rarely taken.
      - name: Read the release note for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: go tool lateregate release-notes "$TAG" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp notes.md body.md
          for part in evidence/smoke.md evidence/conformance.md; do
            if [ -f "$part" ]; then printf '\n' >> body.md; cat "$part" >> body.md; fi
          done
          prerelease=""
          case "${TAG%%+*}" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file body.md
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" $prerelease \
              --title "Arca $TAG" --notes-file body.md assets/*
          fi
