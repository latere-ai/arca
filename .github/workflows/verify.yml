# Every push to main and every pull request runs the gate, the shared
# pipeline of latere-ai/ci, the checks that need the tree and no cluster,
# and the two service tiers of spec 014, each against the Postgres and
# MinIO of compose.yaml on a runner of its own. Every third-party action
# is pinned by commit.
name: verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # Every job runs on GitHub's hosted runners. The repository is public,
  # so they cost nothing, and a hosted runner is a fresh machine per job.
  gate:
    if: "!startsWith(github.ref, 'refs/tags/')"
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1
    with:
      runs_on: ubuntu-latest
      test_os: '["ubuntu-latest"]'

  tidy:
    name: go.mod and go.sum are tidy
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Spec 001's dependency invariant names the module's direct
      # dependencies; go.mod is where a reader checks the claim, so it
      # has to agree with the imports.
      - run: go mod tidy -diff

  image:
    name: the developer image builds
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t arcad:candidate .
      - name: The image reports its version
        run: |
          docker run --rm arcad:candidate -version | grep -q '^arcad '

  # The alerts of spec 018. promtool reads a Prometheus rules file and not a
  # Kubernetes object, so tools/rules prints the rules document inside the
  # PrometheusRule and this job parses that. The Go tests of the same package
  # hold the committed manifest to the table and every metric an alert names
  # to internal/metrics; what only promtool can say is whether the PromQL
  # parses, and that is this job.
  rules:
    name: the alert rules parse
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROMETHEUS_VERSION: "3.7.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install promtool
        run: |
          set -euo pipefail
          tarball="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl -fsSL -o "$tarball.tar.gz" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/$tarball.tar.gz"
          tar -xzf "$tarball.tar.gz"
          sudo install "$tarball/promtool" /usr/local/bin/promtool
          promtool --version
      - name: The rules document parses
        run: |
          mkdir -p out
          go run ./tools/rules > out/rules.yaml
          promtool check rules out/rules.yaml

  # The two service tiers of spec 014. Each job starts the stack from
  # compose.yaml, the same file a contributor runs, so a tier reads one
  # definition of the services rather than a second one written for CI.
  # The ports are fixed here and derived from the directory name locally,
  # because a runner is a machine of its own and a checkout is not.
  store:
    name: the store tier on MinIO and Postgres
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEV_PROJECT: arca
      DEV_DB_PORT: "5432"
      DEV_S3_PORT: "9000"
      DEV_S3_CONSOLE_PORT: "9001"
      E2E_DATABASE_URL: postgres://arca:arca@127.0.0.1:5432/arca?sslmode=disable
      E2E_S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start Postgres and MinIO
        run: make up
      - name: Run the store tier
        run: |
          go test -tags=tiers -race -count=1 -run '^TestStore' \
            -covermode=atomic -coverprofile=store.out \
            ./internal/blob/... ./internal/store/... ./internal/events/... ./internal/reaper/...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-coverage
          path: store.out
          retention-days: 7
          if-no-files-found: error
      - name: What the stack looked like when a test failed
        if: failure()
        run: |
          docker compose -f compose.yaml -p "$DEV_PROJECT" ps
          docker compose -f compose.yaml -p "$DEV_PROJECT" logs --tail=50

  e2e:
    name: the e2e tier, arcad as a process
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEV_PROJECT: arca
      DEV_DB_PORT: "5432"
      DEV_S3_PORT: "9000"
      DEV_S3_CONSOLE_PORT: "9001"
      E2E_DATABASE_URL: postgres://arca:arca@127.0.0.1:5432/arca?sslmode=disable
      E2E_S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start Postgres and MinIO
        run: make up
      - name: Build the binary the tier runs
        run: make build build-stubs
      - name: Run the e2e tier
        env:
          ARCA_BINARY: ${{ github.workspace }}/out/arcad
        run: |
          go test -tags=tiers -race -count=1 -run '^TestE2E' \
            -covermode=atomic -coverprofile=e2e.out ./test/e2e/...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-coverage
          path: e2e.out
          retention-days: 7
          if-no-files-found: error
      - name: What the stack looked like when a test failed
        if: failure()
        run: |
          docker compose -f compose.yaml -p "$DEV_PROJECT" ps
          docker compose -f compose.yaml -p "$DEV_PROJECT" logs --tail=50
