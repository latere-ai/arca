# The shared quality bar, read by `go tool lateregate`. The gates live in
# latere.ai/x/ci-gate, pinned in go.mod; only repository-specific values are
# here.

# The files that name the release. `lateregate release` rewrites each
# pattern's version to the tag it cuts, in the same commit as the changelog
# section, so neither ever lags a tag and main does not go red after a cut.
# A pattern that does not match its file exactly once refuses the release,
# which is why each is anchored on words that appear nowhere else.
release:
  stamp:
    - file: SECURITY.md
      pattern: 'v\d+\.\d+\.\d+ is the\s+current release'
    - file: deploy/prod/kustomization.yaml
      pattern: 'newTag: v\d+\.\d+\.\d+'

cover:
  trim_prefix: latere.ai/x/arca/
  exempt:
    # Spec 017's suite is a black box driver: every case is a request
    # against a running installation, so its statements execute only in a
    # tier that has one. The unit run measures the machinery, and the tests
    # beside it hold that to the contract: the error table against
    # specs/013-api.md, every route and every group against the case list,
    # the pending group, the skip reasons, the run's own names, the
    # cleanup. The cases are run by `make test-conformance` and by the
    # release pipeline's conformance job, neither of which feeds a profile
    # here, so a floor over the unit run alone would be met by deleting
    # cases rather than by writing them.
    test/conformance: >-
      the cases are requests against a running installation and run in the
      conformance tier (spec 017); the unit run measures the machinery, and
      the tier that runs the cases feeds no profile to this gate

spec:
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  started: [dispatched, in-progress, testing, complete]
  settled: [complete, superseded]
  require_section:
    - Overview
    - Design
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]

# The suite runs with only the Go toolchain on PATH. arcad forks no
# binary: bytes go to the bucket through the S3 API and metadata to
# Postgres through its wire protocol, both from Go.
hermetic:
  allow: []

tempdir:
  allow: {}

# Spec 001's dependency invariant: the build list of ./cmd/arcad reaches
# the standard library, latere.ai/x/pkg, the S3 client of spec 003, the
# Postgres driver of spec 004, and the OpenTelemetry SDK, and no cloud
# SDK beyond the S3 API and no Kubernetes client. Until those specs land
# the list is the standard library and pkg, so a new dependency is a
# decision recorded here, one row per package as the specs land.
depcheck:
  packages:
    latere.ai/x/arca/cmd/arcad:
      decision: >-
        the server reaches latere.ai/x/pkg, the standard library, the
        S3 client of spec 003 with the modules the SDK splits itself
        into, the Postgres driver and migrator of spec 004, and the
        OpenTelemetry SDK that pkg/otel exports through, which spec 006
        brought and spec 018 now reads whole: the authorizer client and
        the verifier send their calls through an instrumented transport,
        so the request's trace reaches the operator's endpoint and every
        call is a span, and the node bootstraps the tracer, the metric
        reader and the log bridge, whose OTLP exporters carry all three
        to the endpoint ARCA_OTEL_EXPORTER_OTLP_ENDPOINT names. The
        scrape endpoint of spec 018 adds nothing: it is
        latere.ai/x/pkg/metrics, which links no Prometheus client
        library. Nothing else joins without a row here (spec 001). The S3 SDK is
        the one cloud dependency invariant 9 admits, because it speaks
        the S3 API and nothing else: no cloud control plane, no
        Kubernetes client.
      allow:
        latere.ai/x/pkg: the shared library every Latere service is built on (spec 002)
        github.com/aws/aws-sdk-go-v2: the SDK's core, its signer, and its retry, under the S3 client of spec 003
        github.com/aws/aws-sdk-go-v2/service/s3: the S3 API itself, which spec 003 names as the one bucket contract
        github.com/aws/aws-sdk-go-v2/config: the credential chain, which a deployment uses when ARCA_BUCKET_ACCESS_KEY and ARCA_BUCKET_SECRET_KEY are unset
        github.com/aws/aws-sdk-go-v2/credentials: the static credentials of those two variables, and the providers the chain resolves
        github.com/aws/smithy-go: the SDK's transport and error types; the API error code internal/blob classifies a refusal by
        github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream: an S3 response framing, reached by the S3 client
        github.com/aws/aws-sdk-go-v2/feature/ec2/imds: the instance metadata credentials of the chain
        github.com/aws/aws-sdk-go-v2/internal/configsources: shared endpoint resolution, reached by the S3 client
        github.com/aws/aws-sdk-go-v2/internal/endpoints/v2: shared endpoint resolution, reached by the S3 client
        github.com/aws/aws-sdk-go-v2/internal/ini: the credential file parser of the chain
        github.com/aws/aws-sdk-go-v2/internal/v4a: an S3 signing variant, reached by the S3 client
        github.com/aws/aws-sdk-go-v2/service/internal/accept-encoding: response decoding, reached by the S3 client
        github.com/aws/aws-sdk-go-v2/service/internal/checksum: the trailing sha256 a put carries over TLS (spec 003)
        github.com/aws/aws-sdk-go-v2/service/internal/presigned-url: the presigned reads and part uploads of spec 003
        github.com/aws/aws-sdk-go-v2/service/internal/s3shared: S3 request middleware, reached by the S3 client
        github.com/aws/aws-sdk-go-v2/service/signin: reached by the credential chain
        github.com/aws/aws-sdk-go-v2/service/sso: reached by the credential chain
        github.com/aws/aws-sdk-go-v2/service/ssooidc: reached by the credential chain
        github.com/aws/aws-sdk-go-v2/service/sts: reached by the credential chain
        github.com/jackc/pgx/v5: the Postgres driver and its pool, which spec 004 names; no ORM and no query generator
        github.com/jackc/puddle/v2: the pool pgx builds its own on
        github.com/jackc/pgpassfile: a credential file pgx reads when the connection string names no password
        github.com/jackc/pgservicefile: a connection service file pgx reads
        github.com/jackc/pgerrcode: the SQLSTATE names the migrate driver branches on
        github.com/golang-migrate/migrate/v4: the migrator of spec 004, with its iofs source and its pgx/v5 driver, run through latere.ai/x/pkg/pgxmigrate
        github.com/google/uuid: the object id of spec 003, a UUIDv7 per write of content; reached through latere.ai/x/pkg besides, and not a cloud SDK
        go.opentelemetry.io: the OpenTelemetry SDK and its OTLP exporters, the otelslog bridge that tees every log record beside the local JSON handler, the otelhttp instrumentation of the transport, and the proto types of the wire; the traces, the metrics and the logs of spec 018 go out through them, reached through pkg/otel (spec 006 brought the transport, spec 018 the bootstrap)
        google.golang.org: protobuf and gRPC, the wire format and the transport of the OTLP exporters
        golang.org/x/net: reached by the OTLP exporters
        golang.org/x/sync: the singleflight and errgroup pgx and the migrator reach
        golang.org/x/sys: reached by the OTLP exporters
        golang.org/x/text: the encodings pgx reads a server message in, and reached by the OTLP exporters
        golang.org/x/time: reached by the OTLP exporters and by pkg/ratelimit's token buckets (spec 015)
        github.com/cenkalti/backoff: the OTLP exporters' retry schedule
        github.com/cespare/xxhash: the metric SDK's aggregation keys. The scrape endpoint of spec 018 is latere.ai/x/pkg/metrics, which links no Prometheus client library, so this is the OTLP side alone
        github.com/felixge/httpsnoop: otelhttp's response recorder
        github.com/go-logr: the OpenTelemetry SDK's internal logging interface, with the standard library sink the SDK installs behind it for its own diagnostics
        github.com/grpc-ecosystem/grpc-gateway: the OTLP status marshalling the exporters read errors with

license:
  spdx: MIT
  holder: Latere AI

# The identity shape of the family: specs/infrastructure/identity.md in
# latere-ai/specs. A core verifies and asks; the decision is the
# authorizer's.
identity:
  role: core
  audience: arca
  config_prefix: ARCA
  api_group: arca.latere.ai
  # The default audience of the open core, verified only where the core is
  # self-hosted; Latere reaches it through the origin, spec 006.
  reached_by: self-hosted
  # deploy/prod is Latere's own overlay inside the core's tree (spec 016).
  skip:
    - deploy/prod
  # The same overlay, declared: the no-latere-value rule reads the
  # addresses deploy/prod sets rather than refusing them, so the one
  # directory that names the installation it serves is the one directory
  # the rule does not hold, and a document may name an address it carries.
  overlays:
    - deploy/prod
  # Access is by role: the roles rule runs, and it is one way once set.
  roles_only: true
  # The verifier and authorizer rules carried dated waivers until spec 006
  # landed. internal/auth now verifies with latere.ai/x/pkg/authkit/jwt and
  # asks through latere.ai/x/pkg/authz, so both waivers are gone and the
  # real rules run.
