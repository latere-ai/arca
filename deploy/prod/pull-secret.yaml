# The image is a package on ghcr.io that the kubelet needs a credential to
# pull. `ghcr-secret` is the one every other Latere service in this
# namespace already uses; nothing here creates it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcad
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcad-reaper
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-secret
