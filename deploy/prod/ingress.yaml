# The platform origin. api.latere.ai is one name in front of several
# services, and this object claims only the path prefixes Arca owns, one per
# /v1 namespace of spec 013. There is deliberately no `/` rule: a catch-all
# here would take the whole origin and answer 404 for every route another
# service adds.
#
# The host and its certificate are the platform's, shared by every service
# routed under the origin; the cert-manager annotation below is the one
# exception, explained where it stands, and
# no Certificate of Arca's: this object adds paths and nothing else. The
# secret it names is the one the origin already holds.
#
# Seven of the prefixes are the storage half of the platform's resource
# namespace table, which is the service Arca replaces minus what spec 013
# does not register: `orgs` and `whoami` are identity's, `quotas`,
# `webhooks` and `agent-visibility` are retired, and the `s/{token}` share
# link is now `shares/links/{token}`, already covered by `shares`.
#
# The eighth is `/v1/admin`, the administration surface spec 012 owns. It
# was left out on the reading that at a shared origin the prefix is the
# platform's and not one service's, with spec 012 to say where an
# administrator reaches it instead. Spec 012 never said, and the console
# asked this origin for `/v1/admin/overview` and took a 404 from nginx while
# arcad served the route and every other prefix answered a JSON 401. No
# other service on the origin claims the prefix, so Arca claims it here.
# test/deploy/prod_test.go derives the list from api/openapi.yaml, so a
# namespace the document grows is a red tree rather than a 404 after a
# rollout.
#
# Two probes are here, as exact paths: `/readyz` and `/version`. They are
# what the release smoke reads, and it must read them through the address
# GitHub records as the deployment rather than through a forwarded port. A
# rollout returns as soon as the new pods are ready, and a smoke that
# reached a pod directly would not see an endpoint list that still holds an
# old one; `/version` answering the tag at the origin is the only check that
# does. An exact path takes precedence over every prefix rule on this host
# and claims nothing beyond itself, which is why `/livez` is left out: the
# kubelet reads it and nothing at the origin does.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arcad
  annotations:
    # The origin's certificate. Until the cutover Drive's api ingress
    # carried this annotation and was the only one that did, so its
    # removal would have left api-latere-ai-tls with no issuer; from the
    # cutover this ingress renews it. ps-01 of the platform epic moves it
    # to the origin's own ingress with the other prefixes.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # An object at or below ARCA_INLINE_BYTES streams through the server
    # (spec 007); above it the parts go directly to the bucket and never
    # through this controller. The limit that matters is
    # ARCA_MAX_UPLOAD_BYTES, which the server enforces and reports as an
    # error a client can read.
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.latere.ai
      secretName: api-latere-ai-tls
  rules:
    - host: api.latere.ai
      http:
        paths:
          - path: /v1/files
            pathType: Prefix
            backend:
              service:
                name: arcad
                port:
                  name: http
          - path: /v1/uploads
            pathType: Prefix
            backend:
              service:
                name: arcad
                port:
                  name: http
          - path: /v1/shares
            pathType: Prefix
            backend:
              service:
                name: arcad
                port:
                  name: http
          - path: /v1/workspaces
            pathType: Prefix
            backend:
              service:
                name: arcad
                port:
                  name: http
          - path: /v1/trash
            pathType: Prefix
            backend:
              service:
                name: arcad
                port:
                  name: http
          - path: /v1/stars
            pathType: Prefix
            backend:
              service:
                name: arcad
                port:
                  name: http
          - path: /v1/events
            pathType: Prefix
            backend:
              service:
                name: arcad
                port:
                  name: http
          # Spec 012's administration surface, which the console reaches here.
          - path: /v1/admin
            pathType: Prefix
            backend:
              service:
                name: arcad
                port:
                  name: http
          # The four the release smoke reads, each Exact so it claims
          # nothing beyond itself at an origin several services share.
          # test/deploy/prod_test.go reads the list out of
          # tools/smoke/release.sh, so a path the script grows is a red
          # tree here rather than a 404 after the rollout.
          - path: /livez
            pathType: Exact
            backend:
              service:
                name: arcad
                port:
                  name: http
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: arcad
                port:
                  name: http
          # ImplementationSpecific and not Exact: the nginx admission
          # webhook refuses a path holding a dot under Exact or Prefix,
          # and rejects the whole document rather than the one rule, so
          # the deploy job's apply would fail outright. Nothing else on
          # this origin begins with it, so the prefix match this gives is
          # the same set of requests.
          - path: /openapi.json
            pathType: ImplementationSpecific
            backend:
              service:
                name: arcad
                port:
                  name: http
          - path: /version
            pathType: Exact
            backend:
              service:
                name: arcad
                port:
                  name: http
