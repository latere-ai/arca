# The platform origin. api.latere.ai is one name in front of several
# services, and its /v1 is partitioned by capability, one prefix per core.
# Arca's prefix is `storage`, so this object claims `/v1/storage` and
# nothing else under the version. There is deliberately no `/` rule: a
# catch-all here would take the whole origin and answer 404 for every route
# another service adds.
#
# The host and its certificate are the platform's, shared by every service
# routed under the origin; the cert-manager annotation below is the one
# exception, explained where it stands, and no Certificate of Arca's: this
# object adds paths and nothing else. The secret it names is the one the
# origin already holds.
#
# One rule replaces the eight flat prefixes this object used to claim. The
# rule forwards without a rewrite and `arcad` serves its whole surface under
# ARCA_BASE_PATH, which deploy/prod sets to the same `/v1/storage`, so the
# served OpenAPI document names the paths the router answers at and the two
# cannot drift (spec 027). test/deploy/prod_test.go derives the claim from
# that variable and holds every path of the committed document to `/v1/`, so
# an Ingress and an image that disagree are a red tree rather than a 404
# after a rollout.
#
# Four probes are here, each with a rule of its own at the origin root:
# `/livez`, `/readyz`, `/openapi.json` and `/version`. They sit outside the
# surface and no base path moves them. They are what the release smoke reads,
# and it must read them through the address GitHub records as the deployment
# rather than through a forwarded port. A rollout returns as soon as the new
# pods are ready, and a smoke that reached a pod directly would not see an
# endpoint list that still holds an old one; `/version` answering the tag at
# the origin is the only check that does. An exact path takes precedence over
# every prefix rule on this host and claims nothing beyond itself.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arcad
  annotations:
    # The origin's certificate. Until the cutover Drive's api ingress
    # carried this annotation and was the only one that did, so its
    # removal would have left api-latere-ai-tls with no issuer; from the
    # cutover this ingress renews it. ps-01 of the platform epic moves it
    # to the origin's own ingress with the other prefixes.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # An object at or below ARCA_INLINE_BYTES streams through the server
    # (spec 007); above it the parts go directly to the bucket and never
    # through this controller. The limit that matters is
    # ARCA_MAX_UPLOAD_BYTES, which the server enforces and reports as an
    # error a client can read.
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.latere.ai
      secretName: api-latere-ai-tls
  rules:
    - host: api.latere.ai
      http:
        paths:
          # The capability prefix, forwarded without a rewrite. Every
          # route of spec 013's table answers under it, because arcad
          # registers its surface at ARCA_BASE_PATH and deploy/prod sets
          # that to this same value.
          - path: /v1/storage
            pathType: Prefix
            backend:
              service:
                name: arcad
                port:
                  name: http
          # The four probes the release smoke reads at the root, each
          # Exact so it claims nothing beyond itself at an origin several
          # services share. test/deploy/prod_test.go reads the smoked paths
          # out of tools/smoke/release.sh, so a path the script grows is a
          # red tree here rather than a 404 after the rollout; a smoked path
          # that falls under the prefix rule above is routed by that rule
          # and needs none of its own.
          - path: /livez
            pathType: Exact
            backend:
              service:
                name: arcad
                port:
                  name: http
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: arcad
                port:
                  name: http
          # ImplementationSpecific and not Exact: the nginx admission
          # webhook refuses a path holding a dot under Exact or Prefix,
          # and rejects the whole document rather than the one rule, so
          # the deploy job's apply would fail outright. Nothing else on
          # this origin begins with it, so the prefix match this gives is
          # the same set of requests.
          - path: /openapi.json
            pathType: ImplementationSpecific
            backend:
              service:
                name: arcad
                port:
                  name: http
          - path: /version
            pathType: Exact
            backend:
              service:
                name: arcad
                port:
                  name: http
