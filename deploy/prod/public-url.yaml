# The origin clients reach, and the prefix under which this installation's
# keys are written.
#
# ARCA_PUBLIC_URL is the platform origin, which is where the console's
# Storage section and every consumer call Arca. Every URL the server writes
# is built from it, a presigned redirect included.
#
# ARCA_BUCKET_PREFIX is `drive/` and not the default `arca/`. This
# installation reads the bucket the service Arca replaces wrote
# (spec 019): a key derives from an id and the ids do not change, so
# pointing Arca at the same prefix makes every object Drive wrote an object
# Arca reads, with no copy. The prefix is configuration and names nothing a
# user sees, so it stays as it is rather than costing a copy of every
# object.
#
# ARCA_PUBLIC_CDN_URL is the base a public object's redirect points at.
# The host passes each request to the Spaces CDN in front of the bucket, so
# a key reads the same object there as on the CDN's own name, where Drive
# served public objects and where an address already handed out keeps
# working. An object is answered under the type it was written with, so a
# page someone stored runs on this host. It is on latere.site, a registrable
# domain apart from the origin's, because on latere.ai such a page would be
# same-site with the console and sign-in.
# An installation that leaves the base empty answers the ordinary presigned
# redirect instead, so dropping it would change every public link without
# anything failing. It is not a credential and names nothing secret, so it
# belongs here beside the origin rather than in a Secret. The reaper below
# does not serve a redirect and does not read it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcad
spec:
  template:
    spec:
      containers:
        - name: arcad
          env:
            - name: ARCA_PUBLIC_URL
              value: https://api.latere.ai
            - name: ARCA_BUCKET_PREFIX
              value: drive/
            - name: ARCA_PUBLIC_CDN_URL
              value: https://files.latere.site
---
# The reconciler reads the same prefix. It is held at zero replicas by the
# base, but a reconciler that swept a different prefix from the one the
# server writes under would find every object orphaned, so the two values
# move together or not at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcad-reaper
spec:
  template:
    spec:
      containers:
        - name: arcad
          env:
            - name: ARCA_PUBLIC_URL
              value: https://api.latere.ai
            - name: ARCA_BUCKET_PREFIX
              value: drive/
