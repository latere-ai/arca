# The cluster the stack runs on: one node whose host ports are the node
# ports the overlay sets, so everything the stack publishes is reachable on
# localhost.
#
#   30180  arcad, the public listener
#   30081  the stub issuer
#   30082  the stub authorizer
#   30432  Postgres
#   30900  MinIO
#
# The default CNI is left on, and it enforces NetworkPolicy: kindnetd runs
# kube-network-policies and queues every pod packet to its verdict engine.
# The base's confinement therefore applies here exactly as it does in a
# cluster running Cilium or Calico, which is why the overlay carries
# networkpolicy-stack.yaml: the stack's own dependencies listen on ports the
# base has no reason to admit, and a port no policy names is a connection
# dropped rather than refused.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30180
        hostPort: 30180
      - containerPort: 30081
        hostPort: 30081
      - containerPort: 30082
        hostPort: 30082
      - containerPort: 30432
        hostPort: 30432
      - containerPort: 30900
        hostPort: 30900
