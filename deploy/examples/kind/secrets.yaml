# The three Secrets the base reads, filled in for the stack. The shape is
# deploy/bootstrap/secrets.example.yaml exactly; only the values differ, so
# an operator who has run the stack has already seen the file they must
# write.
#
# The values are published because the stack is disposable: MinIO's
# built-in credential, a Postgres password used by one pod on one node, and
# a bearer the stub authorizer accepts from anyone.
apiVersion: v1
kind: Secret
metadata:
  name: arcad-bucket
type: Opaque
stringData:
  ARCA_BUCKET: arca-test
  ARCA_BUCKET_REGION: us-east-1
  ARCA_BUCKET_ENDPOINT: http://minio:9000
  # MinIO has no virtual-host addressing, so keys are addressed by path.
  ARCA_BUCKET_PATH_STYLE: "true"
  ARCA_BUCKET_ACCESS_KEY: minioadmin
  ARCA_BUCKET_SECRET_KEY: minioadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: arcad-database
type: Opaque
stringData:
  # The key the Deployment maps to arcad's ARCA_DB_URL.
  ARCA_DATABASE_URL: postgres://arca:arca@postgres:5432/arca?sslmode=disable
---
# The stub issuer serves plain HTTP inside the cluster, so the stack admits
# an http:// issuer. No installation outside a test tier sets that.
apiVersion: v1
kind: Secret
metadata:
  name: arcad-auth
type: Opaque
stringData:
  ARCA_OIDC_ISSUERS: http://arca-stubs:8081
  ARCA_OIDC_INSECURE_ISSUERS: "true"
  ARCA_AUTHORIZER_TOKEN: stub
