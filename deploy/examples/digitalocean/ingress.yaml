# The ingress-nginx controller from the DigitalOcean marketplace, with a
# certificate cert-manager issues. Change arca.example.com to your own
# hostname in both places and point its DNS record at the load balancer the
# controller created.
#
# proxy-body-size is the one setting an upload needs from this controller:
# the default is 1m, and an object at or below ARCA_INLINE_BYTES streams
# through the server (spec 007). It is set to 0, which is no limit, because
# ARCA_MAX_UPLOAD_BYTES is where the limit belongs: one place, enforced by
# the server, reported as an error a client can read.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arcad
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - arca.example.com
      secretName: arcad-tls
  rules:
    - host: arca.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arcad
                port:
                  name: http
