# The reconciler of spec 010 as a process of its own, off in the base.
#
# `arcad serve` runs the reconciler on the API replicas by default, which is
# what a small installation wants: one workload, one image, nothing else to
# operate. An installation whose reaper sweeps are long enough to compete
# with a request moves them here instead, by patching replicas to 1 in its
# overlay and setting ARCA_REAP_INTERVAL to 0 on the API replicas.
#
# Replicas is 0 rather than the object being absent, so turning it on is a
# one-field patch an operator can read, and so the resource the patch
# targets always exists. Exactly one replica: the reconciler is a sweep over
# the whole installation and two of them would do the same work twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcad-reaper
  labels:
    app.kubernetes.io/name: arcad
    app.kubernetes.io/component: reaper
spec:
  replicas: 0
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: arcad
      app.kubernetes.io/component: reaper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arcad
        app.kubernetes.io/component: reaper
    spec:
      serviceAccountName: arcad
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: arcad
          image: ghcr.io/latere-ai/arcad:unreleased
          imagePullPolicy: IfNotPresent
          args: [reap]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # The reaper verifies no token, but it reads the same
            # configuration as the server, and a container that read a
            # different one would reconcile against a different
            # installation.
            - name: ARCA_OIDC_AUDIENCE
              value: arca
            - name: ARCA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: arcad-database
                  key: ARCA_DATABASE_URL
          envFrom:
            - secretRef:
                name: arcad-bucket
            - secretRef:
                name: arcad-auth
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
