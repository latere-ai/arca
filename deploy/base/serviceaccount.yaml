# The workload runs under its own account with no token mounted. arcad
# speaks to no API server (spec 001, invariant 9), so it needs no Role and
# no RoleBinding, and a mounted token would be a credential an attacker
# inside the container could use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arcad
  labels:
    app.kubernetes.io/name: arcad
automountServiceAccountToken: false
