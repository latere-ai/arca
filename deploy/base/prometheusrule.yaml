# The alerts of spec 018, one rule per row of that spec's table.
#
# Generated by tools/rules. Edit the table there and run `make rules`; a test
# fails when this file is not what a fresh run produces, and a second test
# fails when an alert names an arca_ metric or a label internal/metrics does
# not register.
#
# This object needs the Prometheus operator's CustomResourceDefinition. Arca
# does not require the operator and the kind example does not install it, so
# deploy/base/kustomization.yaml does not name this file: a base that did
# would fail to apply on every installation without the operator. An
# installation that runs it applies this file beside the base:
#
#   kubectl apply -n <namespace> -f deploy/base/prometheusrule.yaml
#
# The last two alerts are the only ones over metrics Arca does not export.
# kube-state-metrics publishes the Pod conditions and the autoscaler's replica
# counts, and an installation without it does not fire them.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: arcad
  labels:
    app.kubernetes.io/name: arcad
spec:
  groups:
    - name: arcad
      rules:
        - alert: ArcaReadinessFailing
          expr: 'kube_pod_status_ready{condition="true",pod=~"arcad-.*"} == 0'
          for: 5m
          annotations:
            summary: 'An arcad Pod has been out of rotation for five minutes. Read /readyz on the Pod: it names the check that failed.'
        - alert: ArcaErrorRate
          expr: 'sum(rate(arca_requests_total{status_class="5xx"}[5m])) / sum(rate(arca_requests_total[5m])) > 0.01'
          for: 5m
          annotations:
            summary: 'More than one request in a hundred is failing with a server error. The route label says which surface.'
        - alert: ArcaSlowRequests
          expr: 'histogram_quantile(0.95, sum by (le, route) (rate(arca_request_duration_seconds_bucket[5m]))) > 2'
          for: 10m
          annotations:
            summary: 'A route is above two seconds at the 95th percentile.'
        - alert: ArcaBucketErrors
          expr: 'sum(rate(arca_bucket_ops_total{result="error"}[5m])) / sum(rate(arca_bucket_ops_total[5m])) > 0.05'
          for: 5m
          annotations:
            summary: 'More than one bucket call in twenty is failing. A missing object is not counted here; this is the store itself.'
        - alert: ArcaMissingBytes
          expr: 'increase(arca_reaper_findings_total{kind="missing_bytes"}[10m]) > 0'
          annotations:
            summary: 'A row names an object the bucket does not hold. This is invariant 2 broken, and it is the one alert that always reaches a human.'
        - alert: ArcaReaperFailing
          expr: 'increase(arca_reaper_runs_total{outcome="error"}[15m]) > 0 or increase(arca_reaper_runs_total[15m]) == 0'
          annotations:
            summary: 'The reconciler is failing, or has not finished a run in three intervals. The window is three times the default ARCA_REAP_INTERVAL of five minutes; widen it if yours is longer.'
        - alert: ArcaOrphanGrowth
          expr: 'increase(arca_reaper_findings_total{kind="orphan_object",action="found"}[30m]) > 0 and increase(arca_reaper_findings_total{kind="orphan_object",action="repaired"}[30m]) == 0'
          for: 30m
          annotations:
            summary: 'Objects nothing references are being found and none are being removed. Bytes are accumulating that no row will ever name.'
        - alert: ArcaAuthorizerUnavailable
          expr: 'increase(arca_decisions_total{outcome="unavailable"}[5m]) > 0'
          annotations:
            summary: 'A request was refused because the authorizer did not answer. No decision is ever an allow.'
        - alert: ArcaWritesRefusedByLimit
          expr: 'increase(arca_limit_rejections_total[30m]) > 0'
          annotations:
            summary: 'Writes are being refused against the limit an authorizer''s answer carried. The limit is the platform''s and not Arca''s; the administrative overview names the space.'
        - alert: ArcaLedgerDrifting
          expr: 'increase(arca_reaper_findings_total{kind="usage_corrected"}[15m]) > 0'
          for: 15m
          annotations:
            summary: 'The usage ledger keeps needing correction, which is a write path that forgot its delta. It is a bug and not a capacity signal.'
        - alert: ArcaUploadsExpiring
          expr: 'increase(arca_upload_sessions_total{outcome="expired"}[1h]) > increase(arca_upload_sessions_total{outcome="completed"}[1h])'
          for: 1h
          annotations:
            summary: 'Clients are starting more uploads than they finish.'
        - alert: ArcaDatabaseSaturated
          expr: 'arca_db_conns{state="idle"} == 0 and arca_db_conns{state="in_use"} > 0'
          for: 5m
          annotations:
            summary: 'The connection pool has held no idle connection for five minutes. Every further query waits for one to be given back.'
        - alert: ArcaReplicasPinned
          expr: 'kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas'
          for: 15m
          annotations:
            summary: 'The autoscaler has been at its maximum replica count for fifteen minutes.'
