# The three Secrets the base reads. Copy this file, fill it in, apply it by
# hand, and do not commit the filled copy. Every key is a variable of the
# configuration table in specs/002-repository-scaffold.md; this file adds
# none of its own.
#
# Three Secrets and not one, because each is a credential to a different
# endpoint and the family keeps one credential per endpoint: a bucket key
# that leaked should not also open the database.
apiVersion: v1
kind: Secret
metadata:
  name: arcad-bucket
  namespace: arca
type: Opaque
stringData:
  # Any store with the S3 API that honours `If-None-Match: *` on put
  # (spec 003). ARCA_BUCKET_ENDPOINT may be left out on AWS, where the
  # region's default endpoint is correct.
  ARCA_BUCKET: example-bucket
  ARCA_BUCKET_REGION: us-east-1
  ARCA_BUCKET_ENDPOINT: https://s3.us-east-1.amazonaws.com
  # Leave both out to use the SDK's credential chain, which is what an
  # installation with a workload identity wants. A credential named here
  # needs put, get, head, delete, list and presign under one prefix and
  # nothing else.
  ARCA_BUCKET_ACCESS_KEY: replace-me
  ARCA_BUCKET_SECRET_KEY: replace-me
---
# Postgres 16 or newer, with a role that owns the schema: `arcad migrate`
# creates tables and indexes (spec 004).
apiVersion: v1
kind: Secret
metadata:
  name: arcad-database
  namespace: arca
type: Opaque
stringData:
  ARCA_DATABASE_URL: postgres://arca:replace-me@postgres.example.com:5432/arca?sslmode=require
---
# Identity (spec 006). ARCA_OIDC_ISSUERS lists the issuers whose tokens are
# verified, comma separated; every token must carry the audience the base
# sets, which is `arca`.
#
# ARCA_AUTHORIZER_TOKEN is the bearer arcad presents to the authorization
# endpoint. The endpoint's URL is not a credential and is not here: an
# overlay sets ARCA_AUTHORIZER_URL as plain environment, where a reviewer
# reads it beside the rest of the deployment. An installation with no
# authorizer leaves both out, and the owner policy applies with
# ARCA_ADMIN_SUBJECTS naming the administrators.
apiVersion: v1
kind: Secret
metadata:
  name: arcad-auth
  namespace: arca
type: Opaque
stringData:
  ARCA_OIDC_ISSUERS: https://auth.example.com
  ARCA_AUTHORIZER_TOKEN: replace-me
